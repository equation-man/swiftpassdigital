[package]
name = "tick-mark-digital"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7.1"
actix-identity = "0.9.0"
actix-session = { version="0.11.0", features=["cookie-session"] }
actix-web = "4.11.0"
argon2 = "0.5.3"
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
dotenvy = "0.15.7"
env_logger = "0.11.8"
jsonwebtoken = "9.3.1"
log = "0.4.28"
nanoid = "0.4.0"
rand = "0.9.2"
reqwest = { version = "0.12.23", features = ["json"] }
rust_decimal = "1.37.2"
rust_decimal_macros = "1.37.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-native-tls", "uuid", "chrono", "rust_decimal"] }
tokio = { version = "1.47.1", features = ["full"] }
uuid = { version = "1.18.0", features = ["v4", "serde"] }
