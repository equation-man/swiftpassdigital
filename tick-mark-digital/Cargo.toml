[package]
name = "tick-mark-digital"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
actix-cors = "0.7.1"
actix-identity = "0.9.0"
actix-session = { version="0.11.0", features=["cookie-session"] }
actix-web = "4.11.0"
argon2 = "0.5.3"
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
env_logger = "0.11.8"
futures = "0.3.31"
image = "0.25.8"
jsonwebtoken = "9.3.1"
log = "0.4.28"
nanoid = "0.4.0"
qrcode = "0.14.1"
rand = "0.9.2"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version="1.37.2", features = ["serde"] }
rust_decimal_macros = "1.37.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "rust_decimal"] }
strum = "0.27.2"
strum_macros = "0.27.2"
tokio = { version = "1.47.1", features = ["full"] }
uuid = { version = "1.18.0", features = ["v4", "serde"] }
